<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Results</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<header class="topbar">


    <strong>

        📊 My Results

    </strong>


    <a href="/dashboard">

        Dashboard

    </a>


</header>


<main class="page">


    <h1>

        {{ student }}'s Results

    </h1>


    {% if results %}


        {% for result in results %}


            <div class="result-item">


                <div>

                    📄

                    <strong>

                        {{ result }}

                    </strong>

                </div>


                <a
                    href="{{ url_for(
                        'view_result',
                        student_id=session['student_id'],
                        filename=result
                    ) }}"
                    class="small-button"
                >

                    View / Print

                </a>


            </div>


        {% endfor %}


    {% else %}


        <div class="empty">


            <h2>

                No result available

            </h2>


            <p>

                Your administrator has not uploaded
                your result yet.

            </p>


        </div>


    {% endif %}


</main>


</body>

</html>
