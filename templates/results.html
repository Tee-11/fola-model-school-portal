<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Results</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<header class="topbar">

    <strong>
        📊 My Results
    </strong>

    <a href="/dashboard" class="dashboard-button">
        Dashboard
    </a>

</header>


<main class="admin-page">


<section class="admin-card">


    <h2>
        Your Results
    </h2>


    {% for result in results %}


        <div class="list-row">


            <div>

                <strong>

                    {{ result["term"] }}

                </strong>


                <small>

                    {{ result["original_filename"] }}

                </small>

            </div>


            <a
                href="{{ url_for(
                    'view_result',
                    result_id=result['id']
                ) }}"
                class="button"
            >

                Open Result

            </a>


        </div>


    {% else %}


        <p>
            No results have been uploaded yet.
        </p>


    {% endfor %}


</section>


</main>


</body>

</html>
