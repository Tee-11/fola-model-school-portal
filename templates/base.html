<!doctype html>
<html lang="en">
<head>

<meta name="google-site-verification" content="4cjevriJQphAdvb7kJhInz0lhWMiRzfjHvREG6AKS7Q" />

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<meta name="theme-color" content="#0b1f3a">

<link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='pwa-icon.svg') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='fola.png.jpg') }}">

<title>
    {{ title or "FMS School Portal" }}
</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
>

</head>

<body>

<header class="topbar">

    <div class="brand">
        FMS SCHOOL PORTAL
    </div>

    {% if session.get("role") %}

    <nav>

        <a href="{{ url_for('index') }}">
            Dashboard
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </nav>

    {% endif %}

</header>


<main class="container">

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <div class="flash {{ category }}">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}


    {% block content %}

    {% endblock %}

</main>

<script src="{{ url_for('static', filename='pwa.js') }}" defer></script>

</body>
</html>
