<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<header class="topbar">


    <strong>

        🎓 School Portal

    </strong>


    <a href="/logout">

        Logout

    </a>


</header>


<main class="dashboard">


    <section class="welcome">


        <h1>

            Welcome, {{ student }}

        </h1>


        <p>

            Class:

            <strong>

                {{ student_class }}

            </strong>

        </p>


        <p>

            Department:

            <strong>

                {{ student_department }}

            </strong>

        </p>


    </section>



    <section class="modules">


        <a
            href="/subjects"
            class="module"
        >

            <div class="module-icon">

                📚

            </div>


            <h2>

                Subjects

            </h2>


            <p>

                View your class and department
                subjects and e-notes.

            </p>


        </a>


        <a
            href="/news"
            class="module"
        >

            <div class="module-icon">

                📰

            </div>


            <h2>

                School News

            </h2>


            <p>

                Read the latest school
                announcements.

            </p>


        </a>



        <a
            href="/results"
            class="module"
        >

            <div class="module-icon">

                📊

            </div>


            <h2>

                Results

            </h2>


            <p>

                View and print your
                school results.

            </p>


        </a>


    </section>


</main>


</body>

</html>
