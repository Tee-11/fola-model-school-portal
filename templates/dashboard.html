<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>
    <meta name= "viewport" content= "width= device-width, initial-scale= 1">
    <link rel= "stylesheet"
          href= "{{ url_for('static', filename= 'style.css') }}">
</head>
<body>
<header>
    <h1>School Portal</h1>
    <a href= "/logout">Logout</a>
</header>

<div class= "dashboard">
    <h2>Welcome, {{ name }}</h2>
    <p>
       Class: {{ (class_ or "ADMIN").upper() }}
       |
       Stream: {{ (stream or "ADMIN").upper() }}
    </p>
    
    <div class= "modules">
        <a href= "/subjects" class= "module">
            <h2>Subjects</h2>
            <p>
                Access your subjects and e-notes.
            </p>
        </a>

        <a href= "/result" class= "module">
            <h2>Results</h2>
            <p>
                View your term result.
            </p>
        </a>

        <a href= "/news" class= "module">
            <h2>School News</h2>
            <p>
                View the latest school announcements.
            </p>
        </a>

    </div>
</div>
</body>
</html>
