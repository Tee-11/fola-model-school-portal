<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>View Result</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f1f5f9;

        }


        .topbar {

            background: #172554;

            color: white;

            padding: 15px 25px;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .topbar a {

            color: white;

            text-decoration: none;

            background: #2563eb;

            padding: 9px 15px;

            border-radius: 7px;

        }


        .result-container {

            max-width: 1000px;

            margin: 30px auto;

            padding: 0 20px;

        }


        .result-title {

            background: white;

            padding: 20px;

            border-radius: 12px 12px 0 0;

        }


        .result-title h1 {

            margin: 0 0 5px 0;

        }


        .result-title p {

            color: #64748b;

            margin: 0;

        }


        .result-file {

            width: 100%;

            height: 75vh;

            border: none;

            background: white;

            display: block;

        }


        .print-section {

            background: white;

            padding: 25px;

            text-align: center;

            border-radius: 0 0 12px 12px;

        }


        .print-button {

            background: #2563eb;

            color: white;

            border: none;

            padding: 13px 25px;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        .print-button:hover {

            background: #1d4ed8;

        }


        @media print {

            .topbar,
            .print-section {

                display: none;

            }


            .result-container {

                margin: 0;

                padding: 0;

                max-width: none;

            }


            .result-file {

                height: 100vh;

            }

        }

    </style>

</head>


<body>


<header class="topbar">

    <strong>

        📊 Student Result

    </strong>


    <a href="/results">

        Back to Results

    </a>

</header>



<main class="result-container">


    <div class="result-title">

        <h1>

            Result

        </h1>


        <p>

            {{ filename }}

        </p>

    </div>



    <!-- RESULT FILE -->

    <iframe
        class="result-file"
        src="{{ url_for(
            'serve_result_file',
            student_id=student_id,
            filename=filename
        ) }}"
    >

    </iframe>



    <!-- PRINT BUTTON -->

    <div class="print-section">

        <button
            class="print-button"
            onclick="printResult()"
        >

            🖨️ Print Result

        </button>

    </div>


</main>



<script>

function printResult() {

    const iframe =
        document.querySelector(
            ".result-file"
        );


    iframe.contentWindow.print();

}

</script>


</body>

</html>
