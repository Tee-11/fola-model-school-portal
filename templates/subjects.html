<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Subjects</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<header class="topbar">

    <strong>
        📚 Subjects
    </strong>

    <a href="/dashboard" class="dashboard-button">
        Dashboard
    </a>

</header>


<main class="admin-page">


<section class="admin-card">


    <h2>

        {{ class_name }}

        -

        {{ department }}

    </h2>


    <form method="GET">


        <label>
            Select Term
        </label>


        <select
            name="term"
            onchange="this.form.submit()"
        >

            <option
                value="First Term"
                {% if term == "First Term" %}
                    selected
                {% endif %}
            >
                First Term
            </option>


            <option
                value="Second Term"
                {% if term == "Second Term" %}
                    selected
                {% endif %}
            >
                Second Term
            </option>


            <option
                value="Third Term"
                {% if term == "Third Term" %}
                    selected
                {% endif %}
            >
                Third Term
            </option>

        </select>


    </form>


</section>


<section class="admin-card">


    <h2>
        {{ term }}
    </h2>


    {% for subject in subjects %}


        <div class="subject-card">


            <h3>
                📖 {{ subject["subject_name"] }}
            </h3>


            <a
                href="{{ subject['subject_link'] }}"
                target="_blank"
                class="button"
            >

                Open E-note

            </a>


        </div>


    {% else %}


        <p>

            No subjects have been added for
            {{ term }} yet.

        </p>


    {% endfor %}


</section>


</main>


</body>

</html>
