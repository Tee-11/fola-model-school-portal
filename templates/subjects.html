<!DOCTYPE html>
<html>
<head>
  <meta charset= "UTF-8">
  <meta name= "viewport" content= "width= device-width, initial-scale=1.0">
  <title>Subjects</title>
  <style>
    body {font-family: Arial; margin: 0; padding: 20px; background: #f2f2f2;}
   .container {max-width: 500px; margin: 0 auto; text-align: center;}
    h2 {font-size: 22px; color: #004080;}
   .btn {display: block; width: 100%; max-width: 400px; margin: 12px auto; padding: 15px; background: #004080; color: white; text-decoration: none; border-radius: 8px; font-size: 16px; font-weight: bold;}
  </style>
</head>
<body>
  <h2>Welcome {{ name }} to {{ class_ }} - {{ stream }}</h2>
  <p>Click a subject to open e-notes</p>

  {% for subject, link in subjects.items() %}
    <a href= "{{ link }}" target= "_blank" class= "btn">{{ subject }}</a>
  {% endfor %}

  <br><a href= "/logout">Logout</a>
</body>
</html>
