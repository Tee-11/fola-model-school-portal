<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Subjects</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<header class="topbar">


    <strong>

        📚 Subjects

    </strong>


    <a href="/dashboard">

        Dashboard

    </a>


</header>


<main class="page">


    <h1>

        {{ student_class }}

        -

        {{ student_department }}

    </h1>


    <p>

        Your subjects and e-notes

    </p>


    <div class="subject-grid">


        {% for subject, link in subjects.items() %}


            <a
                href="{{ link }}"
                target="_blank"
                class="subject-card"
            >


                <div class="subject-icon">

                    📖

                </div>


                <h2>

                    {{ subject }}

                </h2>


                <span>

                    Open E-notes →

                </span>


            </a>


        {% else %}


            <div class="empty">

                No subjects have been added
                for this class and department.

            </div>


        {% endfor %}


    </div>


</main>


</body>

</html>
