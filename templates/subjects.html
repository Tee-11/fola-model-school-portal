<!DOCTYPE html>
<html>
<head>
  <title>Subjects</title>
  <meta name= "viewport" content= "width= device-width, initial-scale=1">
  <link rel= "stylesheet"
        href= "{{ url_for('static', filename= 'style.css') }}">
</head>

<body>
<header>
    <h1>E-Notes</h1>
    <a href= "/dashboard">Dashboard</a>
</header>

<div class= "page">
    <h2>Subjects</h2>
    {% if subjects %}
        <div class= "subject-list">
            {% for subject, link in subjects.items() %}
                <a href= "{{ link }}" target= "_blank" class= "subject">
                     {{ subject }}
                </a>
            {% endfor %}
        </div> 
    {% else %}
        <p>
            No Subjects have been added to your class yet.
        </p>
    {% endif %}
    
</div>
</body>
</html>
