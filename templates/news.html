{% extends "base.html" %}

{% block content %}

<h1>
    School News
</h1>


{% for item in news %}

<div class="card news">

    <h2>
        {{ item.title }}
    </h2>

    <p>
        {{ item.body }}
    </p>

    <small>
        {{ item.created_at }}
    </small>

</div>

{% else %}

<div class="card">

    <p>
        No school news yet.
    </p>

</div>

{% endfor %}


<a href="{{ back_url }}">
    ← Back
</a>

{% endblock %}
