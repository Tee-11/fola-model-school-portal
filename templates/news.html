<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>School News</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<header class="topbar">

    <strong>
        📰 School News
    </strong>

    <a href="/dashboard" class="dashboard-button">
        Dashboard
    </a>

</header>


<main class="admin-page">


{% for item in news %}


<section class="admin-card">


    <h2>
        {{ item["title"] }}
    </h2>


    <small>

        {{ item["date"] }}

        —

        {{ item["admin"] }}

    </small>


    <p class="news-content">

        {{ item["content"] }}

    </p>


</section>


{% else %}


<section class="admin-card">

    <p>
        No school news has been published yet.
    </p>

</section>


{% endfor %}


</main>


</body>

</html>
