<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School News</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="topbar">

    <h2>School News</h2>

    <a href="{{ url_for('student_dashboard') }}" class="logout">
        Dashboard
    </a>

</header>

<main class="container">

    <h1>School News</h1>

    {% for item in news_items %}

        <article class="news-item">

            <h2>
                {{ item.title }}
            </h2>

            <small>
                {{ item.created_at }}
            </small>

            <p>
                {{ item.body }}
            </p>

        </article>

    {% else %}

        <section class="form-card">

            <p>
                There is no school news at the moment.
            </p>

        </section>

    {% endfor %}

</main>

</body>
</html>
