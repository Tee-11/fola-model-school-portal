<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>School News</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<header class="topbar">


    <strong>

        📰 School News

    </strong>


    <a href="/dashboard">

        Dashboard

    </a>


</header>


<main class="page">


    <h1>

        School News

    </h1>


    {% if news %}


        {% for item in news %}


            <article class="news-item">


                <h2>

                    {{ item["title"] }}

                </h2>


                <div class="news-date">

                    Published:

                    {{ item["date"] }}

                    |

                    By:

                    {{ item["admin"] }}

                </div>


                <p>

                    {{ item["content"] }}

                </p>


            </article>


        {% endfor %}


    {% else %}


        <div class="empty">

            There is no school news yet.

        </div>


    {% endif %}


</main>


</body>

</html>
