<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <title>View Result</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .topbar {
            background: #ffffff;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .button {
            text-decoration: none;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            background: #1f6feb;
            color: white;
        }

        .back {
            background: #555;
        }

        .viewer {
            width: 100%;
            height: calc(100vh - 70px);
            border: none;
            display: block;
            background: white;
        }

        .image-viewer {
            width: 100%;
            height: calc(100vh - 70px);
            object-fit: contain;
            display: block;
            background: #ddd;
        }

        .message {
            padding: 40px;
            text-align: center;
            font-size: 18px;
        }

        @media print {

            .topbar {
                display: none;
            }

            .viewer {
                height: 100vh;
            }

        }

    </style>

</head>

<body>

    <div class="topbar">

        <div class="title">
            {{ result["original_filename"] }}
        </div>
        <div class="buttons">

            <a
                href="{{ url_for('results') }}"
                class="button back"
            >
                Back
            </a>

            <button
                onclick="printResult()"
                class="button"
            >
                Print Result
            </button>

            <a
                href="{{ url_for('download_result', result_id=result['id']) }}"
                class="button"
            >
                Download Result
            </a>

        </div>

    </div>


    {% if file_type == "pdf" %}

        <iframe
            id="resultViewer"
            class="viewer"
            src="{{ result_file }}"
            title="Student Result"
        ></iframe>


    {% elif file_type == "image" %}

        <img
            class="image-viewer"
            id="resultImage"
            src="{{ result_file }}"
            alt="Student Result"
        >


    {% else %}

        <div class="message">

            <p>
                This result format cannot be previewed directly.
            </p>

            <a
                href="{{ result_file }}"
                class="button"
                target="_blank"
            >
                Open Result
            </a>

        </div>

    {% endif %}


    <script>

        function printResult() {

            {% if file_type == "pdf" %}

                const viewer =
                    document.getElementById(
                        "resultViewer"
                    );

                viewer.contentWindow.focus();

                viewer.contentWindow.print();

            {% elif file_type == "image" %}

                const image =
                    document.getElementById(
                        "resultImage"
                    );

                const printWindow =
                    window.open("");

                printWindow.document.write(
                    "<html>" +
                    "<head>" +
                    "<title>Print Result</title>" +
                    "</head>" +
                    "<body style='margin:0;text-align:center;'>" +
                    "<img src='" +
                    image.src +
                    "' style='max-width:100%;'>" +
                    "</body>" +
                    "</html>"
                );

                printWindow.document.close();

                printWindow.focus();

                printWindow.print();

            {% else %}

                window.open(
                    "{{ result_file }}",
                    "_blank"
                );

            {% endif %}

        }

    </script>

</body>

</html>
