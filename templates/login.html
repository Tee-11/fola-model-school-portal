<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FMC School Portal - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0b1f3a, #164a7a);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 95px;
            height: 95px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #0b1f3a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 25px;
            font-weight: bold;
            text-transform: lowercase;
            position: relative;
        }

        .logo::before {
            content: "🎓";
            position: absolute;
            top: -8px;
            font-size: 42px;
        }

        .logo span {
            margin-top: 38px;
        }

        h1 {
            text-align: center;
            color: #0b1f3a;
            margin-bottom: 7px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .flash {
            background: #ffe5e5;
            color: #b00020;
            border: 1px solid #ffb3b3;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            text-align: center;
            font-size: 14px;
        }

        label {
            display: block;
            color: #333;
            font-weight: bold;
            margin-bottom: 7px;
            margin-top: 16px;
        }

        select,
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        select:focus,
        input:focus {
            border-color: #164a7a;
            box-shadow: 0 0 0 2px rgba(22, 74, 122, 0.12);
        }

        .login-btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #0b1f3a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #164a7a;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #888;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            <span>fmc</span>
        </div>

        <h1>FMC School Portal</h1>
        <p class="subtitle">Sign in to continue</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">

            <label for="user_type">Login As</label>

            <select name="user_type" id="user_type" required>
                <option value="">Select account type</option>
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
                <option value="admin">Administrator</option>
            </select>

            <label for="name">Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your registered name"
                required
                autocomplete="username"
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
            >

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="footer">
            FMC School Portal
        </div>

    </div>

</body>
</html>
