<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>School Portal Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body class="login-body">


<div class="login-box">


    <div class="logo">

        🎓

    </div>


    <h1>Fola Model School Portal</h1>


    <p class="subtitle">

        Login to continue

    </p>


    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="alert">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form method="POST">


        <label>Name</label>


        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            required
        >


        <label>Password</label>


        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >


        <button type="submit">

            Login

        </button>


    </form>


</div>


</body>

</html>
