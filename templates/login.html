<!DOCTYPE html>
<html>
<head>
  <title>Fola Model School Portal</title>
  <style>
    body {font-family: Arial; text-align: center; padding: 50px; background: #f2f2f2;}
   .box {background: white; padding: 30px; border-radius: 10px; width: 300px; margin: auto;}
    input, select, button {width: 90%; padding: 10px; margin: 8px 0;}
    button {background: #004080; color: white; border: none; cursor: pointer;}
  </style>
</head>
<body>
  <div class= "box">
    <h2>Fola Model School</h2>
    <h4>E-Notes Portal</h4>
    <form method= "POST">
      <input type= "text" name= "name" placeholder= "Full Name" required>
      <select name= "class" required>
        <option value= "">-- Select Your Class --</option>
        <option value= "jss1">JSS 1</option>
        <option value= "jss2">JSS 2</option>
        <option value= "jss3">JSS 3</option>
        <option value= "ss1">SS 1</option>
        <option value= "ss2">SS 2</option>
        <option value= "ss3">SS 3</option>
      </select>

      <select name= "stream" required
        <option value= "">-- Select your Stream --</option>
        <option value= "general">JSS / No Stream</option>
        <option value= "science">Science</option>
        <option value= "art">Art</option>
        <option value= "commercial">Commercial</option>
      </select>

      <input type= "password" name= "password" placeholder= "Password" required>
      <button type= "submit">Login</button>
    </form>
    {% if error %}<p style= "color:red">{{ error }}</p>{% endif %}
  </div>
</body>
</html>
