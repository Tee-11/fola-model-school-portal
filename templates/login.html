<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>School Portal Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<div class="login-container">

    <h1>🎓 School Portal</h1>

    <p>Login to continue</p>


    {% with messages = get_flashed_messages() %}

        {% for message in messages %}

            <div class="error">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}


    <form method="POST">


        <label>User Type</label>

        <select
            name="user_type"
            required
        >

            <option value="student">
                Student
            </option>

            <option value="teacher">
                Teacher
            </option>

            <option value="admin">
                Administrator
            </option>

        </select>


        <label>Name</label>

        <input
            type="text"
            name="name"
            placeholder="Enter your registered name"
            required
        >


        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >


        <button type="submit">
            Login
        </button>


    </form>


</div>


</body>

</html>
