<!DOCTYPE html>
<html>
<head>
  <meta charset= "UTF-8">
  <meta name= "viewport" content= "width= device-width, initial-scale=1.0">
  <title>Fola Model School Portal</title>
  <style>
   .logo {margin-top: 30px}
    body {font-family: Arial; margin: 0; padding: 20px; background: #f2f2f2; display: flex; justify-content: center; align-items: center; min-height: 100vh;}
   .box {background: white; padding: 25px; border-radius: 10px; width: 100%; max-width: 400px; box-shadow: 0 4px rgba(0,0,0,0.1); margin: auto;}
   .fola {background: #800000; padding: 30px 40px; text-align: center; border-radius: 8px; max-width: 350px;}
    input, select, button {width: 100%; padding: 12px; margin: 10px 0; font-size: 16px; border: 1px solid #ccc; border-radius: 5px;}
    button {background: #004080; color: white; border: none; cursor: pointer; font-weight: bold;}
  </style>
</head>
<body>
  <div class="logo">
      <svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
         <!-- Red diamond border -->
         <polygon points="300,30 570,300 300,570 30,300" fill="white" stroke="#b94b5b" stroke-width="18"/>

         <!-- Graduation Cap -->
         <polygon points="120,190 300,120 480,190 300,260" fill="#555"/>

         <!-- Cap top red decoration -->
         <polygon points="155,190 300,145 445,190 300,235" fill="#d34f62"/>

         <!-- Graduation cap base -->
         <path d="M190 210 L190 270 Q300 330 410 270 L410 210" fill="#555"/>

         <!-- Tassel -->
         <line x1="445" y1="190" x2="445" y2="300" stroke="#555" stroke-width="10"/>
         <circle cx="445" cy="305" r="12" fill="#555"/>

         <!-- Certificate scroll behind the letters -->
         <path d="M155 275 Q140 275 140 295 L140 370 Q140 390 160 390 L440 390 Q460 390 460 370 L460 295 Q460 275 440 275 Z" fill="#f5e8c8" stroke="#d34f62" stroke-width="10">
         <!-- Rolled ends of certificate -->
         <ellipse cx="145" cy="330" rx="25" ry="55" fill="#d34f62"/>
         <ellipse cx="455" cy="330" rx="25" ry="55" fill="#d34f62"/>

         <!-- Certificate lines -->
         <line x1="190" y1="310" x2="410" y2="310" stroke="#b94b5b" stroke-width="5"/>
         <line x1="190" y1="350" x2="400" y2="350" stroke="#b94b5b" stroke-width="5"/>

         <!-- FMS letters over the cap and certificate -->
         <text x="300" y="240" text-anchor="middle" font-size="75" font-family="Georgia, serif" font-weight="bold" fill="#555">F</text>
         <text x="300" y="320" text-anchor="middle" font-size="85" font-family="Georgia, serif" font-weight="bold" fill="#555">M</text>
         <text x="300" y="400" text-anchor="middle" font-size="75" font-family="Georgia, serif" font-weight="bold" fill="#555">S</text>

         <!-- Bottom banner -->
         <rect x="20" y="485" width="560" height="90" fill="#a94454"/>
         <<text x="300" y="540" text-anchor="middle" font-size="27" font-family="Georgia, serif" font-style="italic" fill="white">KNOWLEDGE IS WISDOM & LIGHT</text>
      </svg>
  </div>
  <div class= "box">
    <h2>Fola Model School</h2>
    <h4>E-Notes Portal</h4>
    <form method= "POST">
      <input type= "text" name= "name" placeholder= "Full Name" required>
      <select name= "class" required>
        <option value= "">-- Select Your Class --</option>
        <option value= "jss1">JSS 1</option>
        <option value= "jss2">JSS 2</option>
        <option value= "jss3">JSS 3</option>
        <option value= "ss1">SS 1</option>
        <option value= "ss2">SS 2</option>
        <option value= "ss3">SS 3</option>
      </select>

      <select name= "stream" required
        <option value= "">-- Select your Stream --</option>
        <option value= "general">JSS / No Stream</option>
        <option value= "science">Science</option>
        <option value= "art">Art</option>
        <option value= "commercial">Commercial</option>
      </select>

      <input type= "password" name= "password" placeholder= "Password" required>
      <button type= "submit">Login</button>
    </form>
    {% if error %}<p style= "color:red">{{ error }}</p>{% endif %}
  </div>
</body>
</html>
