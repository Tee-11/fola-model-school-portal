<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1f3a">
  <title>Offline - Fola Model Schools Portal</title>
  <style>
    body{font-family:Arial,sans-serif;min-height:100vh;margin:0;display:grid;place-items:center;background:#f4f6f9;color:#0b1f3a;padding:24px;box-sizing:border-box}
    main{max-width:420px;text-align:center;background:#fff;padding:32px;border-radius:16px;box-shadow:0 8px 28px #00000012}
    img{width:110px;height:110px;object-fit:contain}
    h1{font-size:24px}p{color:#555;line-height:1.6}
    button{border:0;border-radius:8px;background:#0b1f3a;color:#fff;padding:12px 20px;font-weight:bold}
  </style>
</head>
<body><main>
  <img src="/static/fola.png.jpg" alt="Fola Model Schools logo">
  <h1>You are offline</h1>
  <p>Please reconnect to the internet to sign in and access the school portal.</p>
  <button onclick="location.reload()">Try again</button>
</main></body>
</html>
